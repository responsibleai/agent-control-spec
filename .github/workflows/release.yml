# Tag-driven release pipeline.
#
# Trigger: push a tag `v*` (e.g. v0.4.0-beta.1); one tag releases all
# packages together (see RELEASING.md). Or run manually with
# dry_run=true to build everything and skip every upload. A manual run
# never publishes: the preflight job refuses dry_run=false, so the only
# path to the registries is a tag push.
#
# Toolchains are pinned: the Rust toolchain below (keep it on the version
# the ci workflow runs on stable today; see RELEASING.md), maturin by
# hash from .github/requirements/maturin.txt, npm by exact version.
#
# Publishing setup (one-time, per registry):
#   PyPI   — trusted publishing (OIDC): PyPI supports PENDING publishers,
#            so configure BEFORE the first publish at
#            https://pypi.org/manage/account/publishing/ (project
#            agent-control-spec and agent-control-spec-remote-policy,
#            repo responsibleai/agent-control-spec,
#            workflow release.yml, environment release). No token.
#   crates — trusted publishing (OIDC): the crate's publisher is
#            configured (repo responsibleai/agent-control-spec,
#            workflow release.yml, environment release). No token.
#   npm    — trusted publishing (OIDC): the loader and every platform
#            package under sdk/node/npm/ need a publisher (repo
#            responsibleai/agent-control-spec, workflow release.yml,
#            environment release). The packages already on the registry
#            have one; a platform package added later gets its own
#            before the first tag that ships it (RELEASING.md step 4).
#            No token; provenance attaches automatically. Every version
#            publishes under `latest`; a pre-release also gets a channel
#            tag (alpha, beta, rc or next) through `npm dist-tag add`,
#            which trusted publishing allows only while "Allow npm
#            dist-tag" is on for the package's publisher. The setting is
#            on for every published package; the step fails the release
#            if the tag cannot be added, and RELEASING.md keeps the
#            by-hand loop for recovery.
#   NuGet  — trusted publishing (OIDC): policies are user-scoped and
#            pattern-based, so configure BEFORE the first publish
#            (pattern ResponsibleAI.AgentControlSpec*); the NuGet/login
#            action exchanges the workflow OIDC token for a short-lived
#            key. Set the non-sensitive NUGET_USER secret to the
#            nuget.org username that owns the policy.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build everything and produce SBOMs; skip attestation and all uploads. Only `true` is accepted; a tag push is the only way to publish.
        type: boolean
        default: true

permissions:
  contents: read

env:
  # Every manual run is a dry run (preflight refuses dry_run=false), so
  # the publish-side steps also require a pushed tag below.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  # Stops two mistakes before any build starts: a manual dispatch that
  # asks to publish, and a tag whose name does not match the version the
  # package manifests carry.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a manual dispatch that asks to publish
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          echo "::error::A manual run cannot publish. Run it with dry_run=true, or push a v* tag to release."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version surfaces agree
        run: python3 scripts/check-version-consistency.py
      - name: Tag name matches the version surfaces
        if: github.ref_type == 'tag'
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual=$(python3 scripts/check-version-consistency.py | sed -n 's/^package version surfaces agree: //p')
          if [ "$expected" != "$actual" ]; then
            echo "::error::tag $GITHUB_REF_NAME names version $expected but the package manifests say $actual"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $actual"
      - name: Release notes exist for this version
        if: github.ref_type == 'tag'
        run: python3 scripts/release-notes.py "${GITHUB_REF_NAME#v}" > /dev/null

  python:
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; toolchain pinned by RUST_TOOLCHAIN
        with: { toolchain: "${{ env.RUST_TOOLCHAIN }}" }
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build wheel + sdist
        # maturin is installed by hash from the pinned requirements file,
        # the same version pyproject.toml declares for the sdist build. The
        # optional polling package builds without isolation in an environment
        # holding only its setuptools pin, installed by hash the same way, so
        # no build backend is resolved at release time. It builds into its own
        # directory so that it can be published before the base package.
        run: |
          uv venv "$RUNNER_TEMP/maturin-venv"
          uv pip install --python "$RUNNER_TEMP/maturin-venv/bin/python" \
            --require-hashes -r .github/requirements/maturin.txt
          echo "$RUNNER_TEMP/maturin-venv/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/maturin-venv/bin:$PATH"
          maturin --version
          maturin build --release --locked -m sdk/python/Cargo.toml -o dist
          maturin sdist -m sdk/python/Cargo.toml -o dist
          uv venv "$RUNNER_TEMP/setuptools-venv"
          uv pip install --python "$RUNNER_TEMP/setuptools-venv/bin/python" \
            --require-hashes -r .github/requirements/setuptools.txt
          uv build sdk/remote-policy/python --no-build-isolation \
            --python "$RUNNER_TEMP/setuptools-venv/bin/python" \
            --out-dir dist-remote-policy
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sdk/python
          artifact-name: sbom-python.spdx.json
      - name: Optional polling package SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sdk/remote-policy/python
          artifact-name: sbom-python-remote-policy.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2
        with:
          subject-path: |
            dist/*
            dist-remote-policy/*
      - name: Publish the optional polling package to PyPI (trusted publishing)
        # First on purpose: a missing pending publisher for this new project
        # name fails here, before any file of the base package is uploaded.
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1
        with:
          packages-dir: dist-remote-policy
          skip-existing: true
      - name: Publish to PyPI (trusted publishing)
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1
        with:
          packages-dir: dist
          skip-existing: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: |
            dist/*
            dist-remote-policy/*

  rust:
    needs: preflight
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; toolchain pinned by RUST_TOOLCHAIN
        with: { toolchain: "${{ env.RUST_TOOLCHAIN }}" }
      - name: Package (verifies the publishable crate)
        run: cargo package --locked -p agent-control-spec
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: engine
          artifact-name: sbom-rust.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2
        with:
          subject-path: target/package/*.crate
      - name: Authenticate to crates.io (trusted publishing)
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        id: cratesio-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1
      - name: Publish to crates.io
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        # Idempotent: skip when this version already exists (sparse index).
        run: |
          V=$(cargo pkgid -p agent-control-spec | sed 's/.*[#@]//')
          if curl -sf https://index.crates.io/ag/en/agent-control-spec | grep -q "\"vers\":\"$V\""; then
            echo "agent-control-spec $V already on crates.io, skipping"
            exit 0
          fi
          export CARGO_REGISTRY_TOKEN="${{ steps.cratesio-auth.outputs.token }}"
          cargo publish --locked -p agent-control-spec

  # One native binding per platform package under sdk/node/npm/. Linux
  # arm64 builds on the arm64 runner, as the .NET job below does.
  node-build:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; toolchain pinned by RUST_TOOLCHAIN
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - name: Build native binding for ${{ matrix.target }}
        shell: bash
        run: |
          npm ci
          npx napi build --release --platform --target ${{ matrix.target }} \
            --manifest-path native/Cargo.toml --cwd . --output-dir .
        working-directory: sdk/node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-binding-${{ matrix.target }}
          path: sdk/node/*.node

  node:
    needs: node-build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sdk/node/artifacts
      - name: Distribute binaries into platform packages
        # napi artifacts copies each downloaded *.node into the matching
        # committed npm/<platform>/ package dir.
        run: |
          npm ci
          npx napi artifacts -d artifacts
          # The committed binding.js is version-agnostic between bumps:
          # napi's version-check strings are stamped here from
          # package.json, the node-side version source, so the published
          # loader always checks against the version it ships as.
          node scripts/stamp-binding-version.mjs binding.js
          npx tsc
        working-directory: sdk/node
      - name: Pack the six tarballs exactly as they will publish
        # optionalDependencies are injected here rather than committed.
        # They name every platform package under npm/ at the version
        # being released, which is not on the registry until this
        # workflow publishes it, so a committed block would break
        # `npm ci` on every version bump. Injecting at pack time also
        # keeps the platform package versions in lockstep with the
        # loader, and reading the names from npm/*/package.json keeps
        # the list in step with the publish loop below.
        # The tarballs under pack/ are what the attestation covers and
        # what the publish step uploads, so the two cannot drift.
        run: |
          # shellcheck disable=SC2016 # ${...} below are JS template literals, not shell
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.optionalDependencies = Object.fromEntries(
              fs.readdirSync("npm").sort().map(d =>
                [JSON.parse(fs.readFileSync(`npm/${d}/package.json`, "utf8")).name, p.version]));
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          mkdir -p pack
          for d in npm/*/; do
            (cd "$d" && npm pack --pack-destination ../../pack)
          done
          npm pack --pack-destination pack
          ls -l pack
          # Every version publishes under `latest`. A pre-release also
          # gets a channel tag from its label: alpha, beta, rc, or next
          # for any other label. A stable version gets no channel tag.
          # The publish step reads both from the environment. No
          # dist-tag call here, so the dry run stays read-only.
          V=$(node -p "require('./package.json').version")
          case "$V" in
            *-alpha.*) CHANNEL=alpha ;;
            *-beta.*)  CHANNEL=beta ;;
            *-rc.*)    CHANNEL=rc ;;
            *-*)       CHANNEL=next ;;
            *)         CHANNEL= ;;
          esac
          echo "version $V: publish tag latest, channel tag ${CHANNEL:-none (stable)}"
          {
            echo "NPM_VERSION=$V"
            echo "NPM_CHANNEL=$CHANNEL"
          } >> "$GITHUB_ENV"
          # Rehearse the publish of every tarball so a bad path or
          # manifest fails here, on the dry run too, not at upload time.
          for t in pack/*.tgz; do npm publish "./$t" --dry-run --access public --tag latest; done
        working-directory: sdk/node
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sdk/node
          artifact-name: sbom-node.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2
        with:
          subject-path: |
            sdk/node/pack/*.tgz
            sdk/node/npm/**/*.node
      - name: Publish to npm (platform packages, then the loader package)
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        # Publishes the attested tarballs from pack/, never the working
        # tree. Every version publishes under `latest`; a pre-release
        # then gets its channel tag (NPM_CHANNEL, from the pack step).
        # Idempotent: versions that already exist are skipped, and
        # `npm dist-tag add` on an already-tagged version is a no-op.
        run: |
          # The npm bundled with Node 22 predates trusted publishing
          # (npm >= 11.5.1). Pin the exact version; bump it on purpose,
          # never with @latest, from a job that holds the OIDC token.
          npm install -g npm@11.21.0
          npm --version
          V=$NPM_VERSION
          publish() {
            # $1 package name, $2 tarball produced by npm pack
            if npm view "$1@$V" version >/dev/null 2>&1; then
              echo "$1@$V already on npm, skipping"
            else
              # The ./ prefix matters: npm reads a bare "dir/file.tgz" as a
            # GitHub "user/repo" shorthand and tries git ls-remote on it.
            npm publish "./$2" --access public --tag latest
            fi
          }
          tag_channel() {
            # $1 package name. Skipped for a stable version (no channel).
            [ -n "$NPM_CHANNEL" ] || return 0
            # "Allow npm dist-tag" is on for every package's trusted
            # publisher, so a failure here is real and must fail the job.
            npm dist-tag add "$1@$V" "$NPM_CHANNEL"
          }
          for d in npm/*/; do
            P=$(node -p "require('./$d/package.json').name")
            base=${P#@}
            publish "$P" "pack/${base//\//-}-$V.tgz"
          done
          publish "@responsibleai/agent-control-spec" "pack/responsibleai-agent-control-spec-$V.tgz"
          for d in npm/*/; do
            tag_channel "$(node -p "require('./$d/package.json').name")"
          done
          tag_channel "@responsibleai/agent-control-spec"
        working-directory: sdk/node

  # The managed assembly calls the engine through agent_control_spec_ffi,
  # so a package without the native library installs cleanly and then
  # throws DllNotFoundException on the first call. Build one library per
  # supported RID and let the pack step assemble them.
  dotnet-native:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, rid: linux-x64, lib: libagent_control_spec_ffi.so }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, rid: linux-arm64, lib: libagent_control_spec_ffi.so }
          - { os: macos-latest, target: x86_64-apple-darwin, rid: osx-x64, lib: libagent_control_spec_ffi.dylib }
          - { os: macos-latest, target: aarch64-apple-darwin, rid: osx-arm64, lib: libagent_control_spec_ffi.dylib }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rid: win-x64, lib: agent_control_spec_ffi.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; toolchain pinned by RUST_TOOLCHAIN
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - name: Build the engine binding for ${{ matrix.rid }}
        shell: bash
        run: cargo build --release --locked -p agent-control-spec-ffi --target ${{ matrix.target }}
      - name: Stage under its runtime identifier
        shell: bash
        run: |
          mkdir -p "sdk/dotnet/native/runtimes/${{ matrix.rid }}/native"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" \
             "sdk/dotnet/native/runtimes/${{ matrix.rid }}/native/${{ matrix.lib }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-native-${{ matrix.rid }}
          path: sdk/dotnet/native/runtimes/${{ matrix.rid }}/native/${{ matrix.lib }}

  dotnet:
    needs: dotnet-native
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.x" }
      - name: Collect the native libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dotnet-native-*
          path: sdk/dotnet/native/staging
      - name: Lay them out by runtime identifier
        shell: bash
        run: |
          set -euo pipefail
          for dir in sdk/dotnet/native/staging/dotnet-native-*; do
            rid="${dir##*/dotnet-native-}"
            mkdir -p "sdk/dotnet/native/runtimes/$rid/native"
            cp "$dir"/* "sdk/dotnet/native/runtimes/$rid/native/"
          done
          find sdk/dotnet/native/runtimes -type f | sort
      - name: Pack
        # --locked-mode fails when packages.lock.json does not match the
        # csproj instead of resolving a new graph at release time.
        run: |
          dotnet restore --nologo --locked-mode
          dotnet pack src/AgentControlSpec -c Release -o dist --nologo --no-restore -p:AcsNativeAssetsRequired=true
        working-directory: sdk/dotnet
      - name: Prove the packed artifact runs without a local engine build
        shell: bash
        run: |
          set -euo pipefail
          nupkg=$(find sdk/dotnet/dist -name 'ResponsibleAI.AgentControlSpec.*.nupkg' -print -quit)
          version=$(basename "$nupkg" .nupkg)
          version=${version#ResponsibleAI.AgentControlSpec.}
          bash tests/conformance/bindings/dotnet_package.sh "$PWD/sdk/dotnet/dist" "$version"
      - name: SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: sdk/dotnet
          artifact-name: sbom-dotnet.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2
        with:
          subject-path: sdk/dotnet/dist/*.nupkg
      - name: Authenticate to NuGet (trusted publishing)
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        run: dotnet nuget push dist/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: sdk/dotnet

  # The SBOMs the jobs above upload expire with the workflow run. Attach
  # them to a GitHub Release so they outlive it, with the CHANGELOG
  # section for the version as the notes. Runs only for a pushed tag, so
  # a dry run (manual dispatch, even on a tag ref) never creates one.
  github-release:
    needs: [python, rust, node, dotnet]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true
      - name: Create the release with the SBOMs attached
        # Idempotent: a re-run after a partial failure uploads the SBOMs
        # to the existing release instead of failing on a duplicate.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release-notes.py "$version" > notes.md
          ls -l sboms
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists, uploading SBOMs"
            gh release upload "$GITHUB_REF_NAME" sboms/* --clobber
            exit 0
          fi
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease);; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "agent-control-spec $version" \
            --notes-file notes.md "${prerelease[@]}" sboms/*
