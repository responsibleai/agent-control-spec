# Tag-driven release pipeline.
#
# Trigger: push a tag `v*` (e.g. v0.4.0-alpha.1) — one tag releases all
# packages together (see RELEASING.md). Or run manually with
# dry_run=true to build everything and skip every upload.
#
# Publishing setup (one-time, per registry):
#   PyPI   — trusted publishing (OIDC): PyPI supports PENDING publishers,
#            so configure BEFORE the first publish at
#            https://pypi.org/manage/account/publishing/ (project
#            agent-control-spec, repo responsibleai/agent-control-spec,
#            workflow release.yml, environment release). No token.
#   crates — trusted publishing (OIDC): the crate's publisher is
#            configured (repo responsibleai/agent-control-spec,
#            workflow release.yml, environment release). No token.
#   npm    — trusted publishing (OIDC): all five packages (loader +
#            four platform packages) have publishers configured (repo
#            responsibleai/agent-control-spec, workflow release.yml,
#            environment release). No token; provenance attaches
#            automatically.
#   NuGet  — trusted publishing (OIDC): policies are user-scoped and
#            pattern-based, so configure BEFORE the first publish
#            (pattern ResponsibleAI.AgentControlSpec*); the NuGet/login
#            action exchanges the workflow OIDC token for a short-lived
#            key. Set the non-sensitive NUGET_USER secret to the
#            nuget.org username that owns the policy.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attest everything, skip all uploads
        type: boolean
        default: true

permissions:
  contents: read

env:
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  python:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; stable toolchain
        with: { toolchain: stable }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Build wheel + sdist
        run: |
          uv tool install maturin==1.8.7
          maturin build --release --locked -m sdk/python/Cargo.toml -o dist
          maturin sdist -m sdk/python/Cargo.toml -o dist
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdk/python
          artifact-name: sbom-python.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: dist/*
      - name: Publish to PyPI (trusted publishing)
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1
        with:
          packages-dir: dist
          skip-existing: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: { name: python-dist, path: dist/* }

  rust:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; stable toolchain
        with: { toolchain: stable }
      - name: Package (verifies the publishable crate)
        run: cargo package --locked -p agent-control-spec
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: engine
          artifact-name: sbom-rust.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: target/package/*.crate
      - name: Authenticate to crates.io (trusted publishing)
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        id: cratesio-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish to crates.io
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        # Idempotent: skip when this version already exists (sparse index).
        run: |
          V=$(cargo pkgid -p agent-control-spec | sed 's/.*[#@]//')
          if curl -sf https://index.crates.io/ag/en/agent-control-spec | grep -q "\"vers\":\"$V\""; then
            echo "agent-control-spec $V already on crates.io — skipping"
            exit 0
          fi
          export CARGO_REGISTRY_TOKEN="${{ steps.cratesio-auth.outputs.token }}"
          cargo publish --locked -p agent-control-spec

  node-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; stable toolchain
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22" }
      - name: Build native binding for ${{ matrix.target }}
        shell: bash
        run: |
          npm ci
          npx napi build --release --platform --target ${{ matrix.target }} \
            --manifest-path native/Cargo.toml --cwd . --output-dir .
        working-directory: sdk/node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-binding-${{ matrix.target }}
          path: sdk/node/*.node

  node:
    needs: node-build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: sdk/node/artifacts
      - name: Distribute binaries into platform packages
        # napi artifacts copies each downloaded *.node into the matching
        # committed npm/<platform>/ package dir.
        run: |
          npm ci
          npx napi artifacts -d artifacts
          # The committed binding.js is version-agnostic between bumps:
          # napi's version-check strings are stamped here from
          # package.json, the node-side version source, so the published
          # loader always checks against the version it ships as.
          node scripts/stamp-binding-version.mjs binding.js
          npx tsc
          npm pack
        working-directory: sdk/node
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdk/node
          artifact-name: sbom-node.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: |
            sdk/node/*.tgz
            sdk/node/npm/**/*.node
      - name: Publish to npm (platform packages, then the loader package)
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        # optionalDependencies are injected here rather than committed:
        # they cannot be resolved before the platform packages' first
        # publish, and a lockfile referencing unpublished packages breaks
        # npm ci. Once all five packages exist on the registry, the
        # dependency block can move into the committed package.json.
        # Prerelease versions publish under the `alpha` dist-tag.
        # Idempotent: versions that already exist are skipped.
        run: |
          npm install -g npm@latest
          V=$(node -p "require('./package.json').version")
          case "$V" in *-*) T=alpha;; *) T=latest;; esac
          for d in npm/*/; do
            P=$(node -p "require('./$d/package.json').name")
            if npm view "$P@$V" version >/dev/null 2>&1; then
              echo "$P@$V already on npm — skipping"
            else
              (cd "$d" && npm publish --access public --tag "$T")
            fi
          done
          # shellcheck disable=SC2016 # ${...} below are JS template literals, not shell
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync("package.json", "utf8"));
            p.optionalDependencies = Object.fromEntries(
              ["linux-x64-gnu","darwin-x64","darwin-arm64","win32-x64-msvc"]
                .map(t => [`@responsibleai/agent-control-spec-${t}`, p.version]));
            fs.writeFileSync("package.json", JSON.stringify(p, null, 2) + "\n");
          '
          if npm view "@responsibleai/agent-control-spec@$V" version >/dev/null 2>&1; then
            echo "@responsibleai/agent-control-spec@$V already on npm — skipping"
          else
            npm publish --access public --tag "$T"
          fi
        working-directory: sdk/node

  # The managed assembly calls the engine through agent_control_spec_ffi,
  # so a package without the native library installs cleanly and then
  # throws DllNotFoundException on the first call. Build one library per
  # supported RID and let the pack step assemble them.
  dotnet-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, rid: linux-x64, lib: libagent_control_spec_ffi.so }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, rid: linux-arm64, lib: libagent_control_spec_ffi.so }
          - { os: macos-latest, target: x86_64-apple-darwin, rid: osx-x64, lib: libagent_control_spec_ffi.dylib }
          - { os: macos-latest, target: aarch64-apple-darwin, rid: osx-arm64, lib: libagent_control_spec_ffi.dylib }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rid: win-x64, lib: agent_control_spec_ffi.dll }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master; stable toolchain
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build the engine binding for ${{ matrix.rid }}
        shell: bash
        run: cargo build --release --locked -p agent-control-spec-ffi --target ${{ matrix.target }}
      - name: Stage under its runtime identifier
        shell: bash
        run: |
          mkdir -p "sdk/dotnet/native/runtimes/${{ matrix.rid }}/native"
          cp "target/${{ matrix.target }}/release/${{ matrix.lib }}" \
             "sdk/dotnet/native/runtimes/${{ matrix.rid }}/native/${{ matrix.lib }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnet-native-${{ matrix.rid }}
          path: sdk/dotnet/native/runtimes/${{ matrix.rid }}/native/${{ matrix.lib }}

  dotnet:
    needs: dotnet-native
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with: { dotnet-version: "8.0.x" }
      - name: Collect the native libraries
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: dotnet-native-*
          path: sdk/dotnet/native/staging
      - name: Lay them out by runtime identifier
        shell: bash
        run: |
          set -euo pipefail
          for dir in sdk/dotnet/native/staging/dotnet-native-*; do
            rid="${dir##*/dotnet-native-}"
            mkdir -p "sdk/dotnet/native/runtimes/$rid/native"
            cp "$dir"/* "sdk/dotnet/native/runtimes/$rid/native/"
          done
          find sdk/dotnet/native/runtimes -type f | sort
      - name: Pack
        run: |
          dotnet restore --nologo
          dotnet pack src/AgentControlSpec -c Release -o dist --nologo -p:AcsNativeAssetsRequired=true
        working-directory: sdk/dotnet
      - name: Prove the packed artifact runs without a local engine build
        shell: bash
        run: |
          set -euo pipefail
          nupkg=$(find sdk/dotnet/dist -name 'ResponsibleAI.AgentControlSpec.*.nupkg' -print -quit)
          version=$(basename "$nupkg" .nupkg)
          version=${version#ResponsibleAI.AgentControlSpec.}
          bash scripts/verify-dotnet-package.sh "$PWD/sdk/dotnet/dist" "$version"
      - name: SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: sdk/dotnet
          artifact-name: sbom-dotnet.spdx.json
      - name: Attest build provenance
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v2
        with:
          subject-path: sdk/dotnet/dist/*.nupkg
      - name: Authenticate to NuGet (trusted publishing)
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish to NuGet
        if: env.DRY_RUN != 'true' && github.ref_type == 'tag'
        run: dotnet nuget push dist/*.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
        working-directory: sdk/dotnet
