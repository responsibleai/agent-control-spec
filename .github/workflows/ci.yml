# CI for the agent-control-spec runtime.
#
# Every job runs on every PR and push to main: a required status check
# that can skip deadlocks the branch-protection gate (path-filtered and
# bot-pushed heads have both done so in this organization's repos).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install locked dependencies, then the package itself
        # requirements-dev.lock pins every transitive dep including the
        # maturin build backend; --no-build-isolation makes the editable
        # install use that pinned maturin, and [tool.maturin] locked=true
        # pins the Rust side via sdk/python/Cargo.lock.
        run: |
          uv pip install --system -r sdk/python/requirements-dev.lock
          uv pip install --system --no-deps --no-build-isolation -e ./sdk/python
      - run: ruff format --check sdk/python scripts && ruff check sdk/python scripts
      - run: pytest sdk/python/tests -v

  # Cross-platform build+test of the Rust workspace plus one binding's
  # suite (Python: the maturin wheel builds and pytest runs on every OS).
  # Advisory: NOT in the required-check set — required names must be
  # stable and always-reporting before promotion.
  engine-xplat:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: cargo test --workspace --all-features --locked
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Install and test the Python binding
        # requirements-dev.lock is compiled on Linux and is not portable;
        # this advisory job installs the package (Rust side still pinned
        # via [tool.maturin] locked=true) plus pytest. agent-hooks-sdk
        # ships only a manylinux wheel at 0.1.0a3, so macOS and Windows
        # build it from the sdist with the toolchain installed above.
        shell: bash
        run: |
          uv pip install --system ./sdk/python pytest
          pytest sdk/python/tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint (pinned, checksum-verified)
        run: |
          curl -sSfL -o actionlint.tgz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          ./actionlint -color
      - name: Version surfaces agree
        run: python3 scripts/check-version-consistency.py
      - name: cargo-audit over example lockfiles (pinned, checksum-verified)
        # Examples are deliberately outside the Dependabot update config,
        # and the coding_agent app's path dependency predates the engine
        # port so cargo cannot re-resolve its manifest; auditing the
        # lockfiles directly keeps their advisories visible in CI.
        run: |
          curl -sSfL -o cargo-audit.tgz \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz
          echo "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  cargo-audit.tgz" | sha256sum -c -
          tar -xzf cargo-audit.tgz
          find examples -name Cargo.lock -print0 | xargs -0 -r -n1 \
            ./cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit audit --file
      - name: JSON artefacts parse
        run: |
          set -e
          find spec conformance tests engine/tests/fixtures -name '*.json' -print0 \
            | xargs -0 -n1 python3 -m json.tool > /dev/null
          echo "all JSON artefacts parse"

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - run: npm ci
        working-directory: sdk/node
      - run: npm test
        working-directory: sdk/node
      # `npm test` regenerates binding.js and binding.d.ts, which are
      # committed and shipped in the npm package. Without this gate a
      # native signature change leaves a stale declaration in the
      # published types and CI stays green. binding.js is compared
      # modulo napi's embedded version-check strings: those are stamped
      # from package.json at publish time (release.yml), so a version
      # bump does not have to regenerate the bindings (#31). Stamping
      # both sides to the same version leaves only real generator-output
      # drift to fail the diff.
      - name: generated bindings are current
        run: |
          git diff --exit-code -- binding.d.ts
          git show HEAD:sdk/node/binding.js > /tmp/binding.committed.js
          node scripts/stamp-binding-version.mjs /tmp/binding.committed.js
          node scripts/stamp-binding-version.mjs binding.js
          diff -u /tmp/binding.committed.js binding.js
        working-directory: sdk/node

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - run: cargo build --release --locked -p agent-control-spec-ffi
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - run: dotnet restore --nologo
        working-directory: sdk/dotnet
      # The end-to-end emitter test self-skips here: the agent-hooks
      # native library is not available in this repository's CI.
      - run: dotnet test --nologo
        working-directory: sdk/dotnet
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
      # The suite above runs with the engine on the loader path, which a
      # consumer installing from NuGet does not have. Pack and run the
      # artifact itself so a package that omits the native library fails
      # here rather than in someone else's process.
      - name: Verify the packed package works without a local engine build
        run: |
          set -euo pipefail
          mkdir -p sdk/dotnet/native/runtimes/linux-x64/native
          cp target/release/libagent_control_spec_ffi.so \
             sdk/dotnet/native/runtimes/linux-x64/native/
          dotnet pack sdk/dotnet/src/AgentControlSpec -c Release -o "$PWD/ci-feed" \
            --nologo -p:AcsNativeAssetsRequired=true -p:Version=0.0.0-ci
          bash scripts/verify-dotnet-package.sh "$PWD/ci-feed" 0.0.0-ci

  # Streaming reaches each language through a different binding
  # mechanism, so agreement between them is not structural. Run one
  # scenario in all four and diff.
  streaming-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: cargo build --release --locked -p agent-control-spec-ffi
      - name: Build the node binding
        run: |
          npm ci
          npm run build
        working-directory: sdk/node
      - name: Build and install the python wheel
        run: |
          pip install maturin==1.8.7
          maturin build --release -m sdk/python/Cargo.toml -o dist
          pip install dist/*.whl
      - name: Compare every language across the whole surface
        run: python tests/conformance/parity/cross_language_parity.py
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release

  # The suites and the parity harness run against this checkout, where the
  # engine is on the loader path and the packages are importable from
  # source. A consumer has a crate, a wheel, a tarball and a nupkg. A
  # published .NET package once passed every test and threw
  # DllNotFoundException on the first call a consumer made, so build the
  # real artifacts and run the surface from a clean install of each.
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install maturin==1.8.7
      - run: npm ci
        working-directory: sdk/node
      - run: python scripts/verify-artifacts.py
