# Weekly grouped dependency updates. Examples are pinned demos and are
# deliberately excluded; their lockfiles are instead audited by the ci
# lint job's cargo-audit step. The release workflow's action pins are
# covered by the github-actions ecosystem.
version: 2
updates:
  - package-ecosystem: cargo
    # Workspace ROOTS only: sdk/ffi and sdk/node/native are members of the
    # root workspace (shared Cargo.lock) and are covered by "/". Listing a
    # member directory makes Dependabot's grouped fetcher fail with
    # "No Cargo.toml!" because it cannot see the workspace root.
    directories:
      - "/"
      - "/sdk/python"
    schedule: { interval: weekly }
    groups:
      rust: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: "/sdk/node"
    schedule: { interval: weekly }
    groups:
      node: { patterns: ["*"] }
  - package-ecosystem: pip
    directory: "/sdk/python"
    schedule: { interval: weekly }
    groups:
      python: { patterns: ["*"] }
  - package-ecosystem: nuget
    directory: "/sdk/dotnet"
    schedule: { interval: weekly }
    groups:
      dotnet: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
