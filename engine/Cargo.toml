[package]
name = "agent-control-spec"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.85"
description = "Agent Control Specification: a stateless policy decision runtime implementing the agent-hooks interceptor contract"
readme = "../README.md"
keywords = ["agents", "policy", "security", "runtime"]
categories = ["config"]

[lib]
name = "agent_control_spec"
crate-type = ["lib"]

[features]
# The default surface is the core plus the bundled in-process Rego
# dispatcher and the bundled Cedar dispatcher. Hosts that do not want
# either heavyweight backend can disable default features and opt back in.
#
# * `rego` gates `pub mod rego`, the `Regorus*` re-exports, and the default
#   policy dispatcher. Rego is evaluated in process with the `regorus`
#   crate, so no external binary is required and evaluation costs no
#   process spawn.
# * `opa` gates `pub mod opa` and the `Opa*` re-exports: the legacy
#   dispatcher that shells out to the `opa` CLI. It is OFF by default
#   because the in-process `rego` path is faster and dependency free at
#   run time; hosts that need OPA's exact CLI semantics can opt back in.
# * `cedar` gates the `CedarBuiltinDispatcher` powered by the upstream
#   `cedar-policy` crate. The manifest grammar, `PolicyConfig::Cedar`, the
#   `CedarPolicyDispatcher` trait, the request mapping, the advice
#   translator, and the always-compiled `CedarTestDispatcher` stay
#   available under no-default-features.
default = ["rego", "cedar"]
rego = ["dep:regorus"]
opa = []
cedar = ["dep:cedar-policy"]
# NOTE: because this gate is off by default, `cargo test` without
# `--all-features` compiles the streaming test binaries to nothing and reports
# green having run none of them. CI passes `--all-features`, so use that
# locally before trusting a green run that touched this module.
#
# `streaming` gates `pub mod stream_session` and its re-exports, the host
# side accounting for the incremental stream profile in specification
# section 18.1. OFF by default for two reasons. The profile is opt in, so a
# host that assembles a stream before evaluating it never needs the module.
# And a `StreamSession` carries per stream state, which the default surface
# of this crate deliberately does not, so gating it keeps the statelessness
# invariant in section 1.1 true of everything a caller gets by default. The
# runtime itself is untouched either way: each segment is one ordinary
# stateless evaluation, and the session only records what they cleared.
streaming = []
# Bundled reference dispatchers providing zero-config defaults. OFF by
# default.
default-dispatchers = []
aacs = ["default-dispatchers"]
openai_moderation = ["default-dispatchers"]
perspective = ["default-dispatchers"]
llama_guard = ["default-dispatchers"]
lakera_guard = ["default-dispatchers"]
auto = ["default-dispatchers"]

[dependencies]
agent-hooks-sdk = "0.1.0-alpha.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
serde_yaml = "0.9"
sha2 = "0.10"
base64 = "0.22"
url = "2"
ureq = "3"
cedar-policy = { version = "4", optional = true }
regorus = { version = "0.11", features = ["arc"], optional = true }

[dev-dependencies]
agent-hooks-sdk = { version = "0.1.0-alpha.3", features = ["ctk"] }
tokio = { version = "1", features = ["macros", "rt"] }
jsonschema = { version = "0.17", default-features = false }

# The benchmark drives `ActivatedPolicy::activate_manifest`, which needs
# the bundled dispatchers, so it is built only when they are on. Without
# this, `cargo test -p agent-control-spec` fails to build the example
# under the default feature set.
[[example]]
name = "benchmark"
required-features = ["default-dispatchers", "rego"]
