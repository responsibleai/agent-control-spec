[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-spec-generator"
version = "0.4.0a4"
description = "Generate Agent Control Specification manifests and Rego policy from natural-language guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Responsible AI" }]
keywords = ["agents", "policy", "security", "agent-hooks", "rego"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "agent-control-spec>=0.4.0a4,<0.5",
  "agent-hooks-sdk>=0.1.0a5,<0.2",
  "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/responsibleai/agent-control-spec"

[project.scripts]
acs-policy-gen = "agent_control_spec_generator.cli:main"

[tool.setuptools]
packages = ["agent_control_spec_generator"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
