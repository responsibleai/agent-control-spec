# Benchmark variant of `manifest.yaml`: the same policy bundle, the same
# policy targets, the same per-point Rego queries, with every annotator
# binding removed.
#
# The SDK benchmarks (sdk/node/bench, sdk/python/bench) drive the
# bindings, which wire the zero-config dispatchers. Every annotator type
# the specification defines — classifier, llm, endpoint — calls an HTTP
# endpoint, so under `manifest.yaml` a binding-side evaluation fails
# closed at annotation (`runtime_error:annotation_failed`) before the
# policy engine is ever reached, and a benchmark over it would time the
# annotator error path rather than activation and Rego evaluation. The
# engine's own end-to-end test (engine/tests/bank_agent.rs) covers the
# annotated manifest by supplying a fixture annotator, which a binding
# cannot do.
#
# Not a conformance asset: `manifest.yaml` is the example.
agent_control_specification_version: "0.4.0-alpha.1"
metadata:
  name: "bank-agent-bench"
extends: []
policies:
  bank_agent_rego:
    type: rego
    bundle: ./policy
    query: data.agent_control_specification.bank_agent_rego.verdict
intervention_points:
  agent_startup:
    policy_target: "$.agent"
    policy_target_kind: agent_metadata
    policy:
      id: bank_agent_rego
      query: data.agent_control_specification.bank_agent_rego.agent_startup_verdict
  input:
    policy_target: "$.input"
    policy_target_kind: user_input
    policy:
      id: bank_agent_rego
      query: data.agent_control_specification.bank_agent_rego.input_verdict
  pre_model_call:
    policy_target: "$.model_request"
    policy_target_kind: model_request
    policy:
      id: bank_agent_rego
      query: data.agent_control_specification.bank_agent_rego.pre_model_call_verdict
  post_model_call:
    policy_target: "$.model_response"
    policy_target_kind: model_response
    policy:
      id: bank_agent_rego
      query: data.agent_control_specification.bank_agent_rego.post_model_call_verdict
  pre_tool_call:
    policy_target: "$.tool_call.args"
    policy_target_kind: tool_args
    tool_name_from: "$.tool_call.name"
    policy:
      id: bank_agent_rego
      query: data.agent_control_specification.bank_agent_rego.pre_tool_call_verdict
  post_tool_call:
    policy_target: "$.tool_result"
    policy_target_kind: tool_result
    tool_name_from: "$.tool_call.name"
    policy:
      id: bank_agent_rego
      query: data.agent_control_specification.bank_agent_rego.post_tool_call_verdict
  output:
    policy_target: "$.output"
    policy_target_kind: assistant_output
    policy:
      id: bank_agent_rego
      query: data.agent_control_specification.bank_agent_rego.output_verdict
  agent_shutdown:
    policy_target: "$.summary"
    policy_target_kind: shutdown_summary
    policy:
      id: bank_agent_rego
      query: data.agent_control_specification.bank_agent_rego.agent_shutdown_verdict
tools:
  lookup_account:
    type: Tool
    id: lookup_account
    clearance: [banking, customer_data]
    security_labels: [customer_profile]
  wire_transfer:
    type: Tool
    id: wire_transfer
    clearance: [banking, payments]
    security_labels: [payment_instruction]
