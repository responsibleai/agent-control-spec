remote_policy:
  endpoint: https://policies.example.net
  credential_ref: policy-reader
  # Define this credential in the host or add a registered provider here.
  poll_interval_seconds: 300
  request_timeout_seconds: 10
  agents:
    - agent_id: agent-1
      tenant_id: tenant-1
      policy_id: policy-1
    - agent_id: agent-2
      tenant_id: tenant-1
      policy_id: policy-2
