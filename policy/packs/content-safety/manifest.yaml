agent_control_specification_version: "0.4.0-alpha.1"
metadata:
  name: content-safety
policies:
  gate:
    type: rego
    bundle: ./policy.rego
    data_paths: [./config.json, ../common.rego]
    query: data.acs.packs.content_safety.verdict
annotators:
  content_safety:
    type: classifier
intervention_points:
  input: &gate
    policy_target: $.target
    policy: {id: gate}
    annotations:
      content_safety: {from: $target}
  post_model_call: *gate
  post_tool_call: *gate
  output: *gate
