agent_control_specification_version: "0.4.0-alpha.1"
metadata:
  name: credentials
policies:
  gate:
    type: rego
    bundle: ./policy.rego
    data_paths: [./config.json, ../common.rego, ../../lib/patterns.rego]
    query: data.acs.packs.credentials.verdict
intervention_points:
  pre_model_call: &gate
    policy_target: $.target
    policy: {id: gate}
  pre_tool_call: *gate
  post_tool_call: *gate
  post_model_call: *gate
  output: *gate
