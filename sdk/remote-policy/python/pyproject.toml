[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-control-spec-remote-policy"
version = "0.4.0b1"
description = "Optional remote policy polling and credential interfaces for Agent Control Specification."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Microsoft" }]
keywords = ["agents", "policy", "security", "agent-hooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "agent-control-spec>=0.4.0b1,<0.5",
  "httpx>=0.28.1,<0.29",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
azure = ["azure-identity>=1.25.3,<2", "aiohttp>=3.14.4,<4"]

[project.urls]
Repository = "https://github.com/responsibleai/agent-control-spec"

[tool.setuptools]
packages = ["agent_control_spec_remote_policy"]
include-package-data = false

[tool.setuptools.package-data]
agent_control_spec_remote_policy = ["py.typed"]

[tool.pyright]
typeCheckingMode = "strict"
# DTOs and provider replies also validate callers without static type checking.
reportUnnecessaryIsInstance = false
pythonVersion = "3.11"
include = [
  "agent_control_spec_remote_policy",
  "tests_remote_policy",
  "../../../examples/remote_policy/demo.py",
  "../../../examples/remote_policy/server.py",
]
extraPaths = [".", "../../python", "../../.."]

[tool.pytest.ini_options]
# Resolve the optional package from an installed wheel, not a shadow checkout.
addopts = ["--import-mode=importlib"]
# Shared test helpers and the parent-owned reference example live in the checkout.
pythonpath = ["../../.."]
