[package]
name = "agent-control-spec-node"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Node native binding over the Agent Control Specification runtime"

[lib]
name = "agent_control_spec_node"
crate-type = ["cdylib"]

[dependencies]
agent-control-spec = { path = "../../../engine", features = ["default-dispatchers"] }
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"
