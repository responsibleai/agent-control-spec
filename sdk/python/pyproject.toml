[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "agent-control-spec"
version = "0.4.0a3"
description = "Agent Control Specification: a stateless policy decision runtime implementing the agent-hooks interceptor contract."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Responsible AI" }]
keywords = ["agents", "policy", "security", "agent-hooks"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
]
dependencies = ["agent-hooks-sdk==0.1.0a5"]

[project.urls]
Repository = "https://github.com/responsibleai/agent-control-spec"

[tool.maturin]
locked = true
features = ["pyo3/extension-module", "pyo3/abi3-py311"]
module-name = "agent_control_spec._native"
python-source = "."
manifest-path = "Cargo.toml"
