[package]
name = "agent-control-spec-py"
version = "0.4.0-alpha.4"
edition = "2021"
license = "MIT"
description = "Python native binding for the Agent Control Specification runtime."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
agent-control-spec = { version = "0.4.0-alpha.4", path = "../../engine", features = ["default-dispatchers", "streaming"] }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
serde_json = "1"
# Authoring AST serialization is private to this Python tooling surface.
# Pin its layout independently of the runtime's semver-compatible dependency.
regorus = { version = "=0.12.0", features = ["arc", "ast"] }

[workspace]
