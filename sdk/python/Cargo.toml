[package]
name = "agent-control-spec-py"
version = "0.4.0-alpha.1"
edition = "2021"
license = "MIT"
description = "Python native binding for the Agent Control Specification runtime."
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
agent-control-spec = { version = "0.4.0-alpha.1", path = "../../engine", features = ["default-dispatchers"] }
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py311"] }
serde_json = "1"

[workspace]
